name: personal_cashflow
description: "Personal Cashflow - a clean, private cash book. Track cash in/out across multiple books, with encrypted backups and no ads."
publish_to: "none"
version: 1.3.2+6
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  intl: ^0.19.0
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  share_plus: ^10.0.2
  pdf: ^3.11.1
  printing: ^5.13.2
  encrypt: ^5.0.3
  crypto: ^3.0.3
  google_fonts: ^6.2.1
  excel: ^4.0.6
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
